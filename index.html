function AgentCard({ agent, isOpen, onToggle }) {
  const panelId = `agent-panel-${agent.name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`;

  return (
    <div
      className="interactive-control"
      role="button"
      tabIndex={0}
      onClick={onToggle}
      onKeyDown={(e) => {

          e.preventDefault();
          onToggle();
        }
      }}
      aria-expanded={isOpen}
      aria-controls={panelId}
      style={{ background: isOpen ? "#141414" : "#0F0F0F", border: `1px solid ${isOpen ? agent.color + "55" : "#1A1A1A"}`, borderRadius: 10, padding: isOpen ? 20 : 14, transition: "all 0.15s ease" }}

          <div style={{ fontSize: 10, color: "#666", marginTop: 2 }}>{agent.domain}</div>
        </div>

\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518`}</pre>
            </div>
            <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 12, color: "#00BFA5" }}>Key Design Principles</div>
            {[
              { label: "Twin = Source of Truth", desc: "Agents never store state outside the Twin. If an agent needs something, it reads from the Twin. If it produces something, it writes to the Twin via event commits." },
              { label: "Agents = Stateless Reasoners", desc: "Each agent is a function: Twin State \u2192 Proposals. They have no persistent memory outside the Twin\u2019s agent_memory layer. Can be upgraded or swapped without data loss." },
              { label: "Event-Sourced Everything", desc: "Nothing is ever overwritten. Every biomarker reading, every recommendation, every agent decision is an immutable event. \u2018Current state\u2019 is always computed. You can time-travel to any point." },
              { label: "Async Communication", desc: "Agents don\u2019t call each other directly. They post to a message bus. The Orchestrator reads all messages and manages the consensus cycle. This prevents cascading failures." },
              { label: "User Controls the Loop", desc: "The system recommends, the user decides. Every recommendation is a proposal, not a command. The Twin records whether the user followed it and what happened." },
            ].map((p, i) => (
              <div key={i} style={{ marginBottom: 14, paddingLeft: 16, borderLeft: "2px solid #1A1A1A" }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#CCC", marginBottom: 2 }}>{p.label}</div>
                <div style={{ fontSize: 11, color: "#777", lineHeight: 1.6 }}>{p.desc}</div>
              </div>
            ))}
          </div>
        )}

        {activeSection === "agents" && (
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: "0 0 8px 0" }}>Agent Roster</h2>
            <p style={{ color: "#777", fontSize: 12, lineHeight: 1.7, marginBottom: 24 }}>5 domain specialists + 1 orchestrator. Each has a distinct voice, reads/writes specific Twin layers, and has known tension points with other agents.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {agents.map((a) => (<AgentCard key={a.name} agent={a} isOpen={openAgent === a.name} onToggle={() => setOpenAgent(openAgent === a.name ? null : a.name)} />))}
            </div>
            <div style={{ marginTop: 24, background: "#0A0A0A", border: "1px solid #1A1A1A", borderRadius: 8, padding: 16 }}>
              <div style={{ fontSize: 9, letterSpacing: 2, color: "#00E676", marginBottom: 8 }}>WHY THESE 5 + 1</div>
              <p style={{ fontSize: 11, color: "#888", lineHeight: 1.7, margin: 0 }}>These 5 domains cover the major controllable levers of longevity: metabolic health, sleep/recovery, nutrition, exercise, and biological aging. The Orchestrator exists because multi-agent consensus without a coordinator leads to deadlocks. Start with these 5 \u2014 add Mental Health, Hormonal, or Cognitive agents later as the Twin schema is extensible.</p>
            </div>
          </div>
        )}

        {activeSection === "consensus" && (
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: "0 0 8px 0" }}>Consensus Protocol</h2>
            <p style={{ color: "#777", fontSize: 12, lineHeight: 1.7, marginBottom: 24 }}>Agents must agree before updating the Twin or surfacing recommendations. This 6-step protocol runs daily and on-demand when new data arrives.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {consensusSteps.map((s) => (
                <div
                  key={s.step}
                  className="interactive-control"
                  role="button"
                  tabIndex={0}
                  onClick={() => setOpenStep(openStep === s.step ? null : s.step)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" || e.key === " ") {
                      e.preventDefault();
                      setOpenStep(openStep === s.step ? null : s.step);
                    }
                  }}
                  aria-expanded={openStep === s.step}
                  aria-controls={`consensus-panel-${s.step}`}
                  style={{ background: openStep === s.step ? "#111" : "#0C0C0C", border: `1px solid ${openStep === s.step ? "#00E67633" : "#161616"}`, borderRadius: 8, padding: openStep === s.step ? 16 : "12px 16px" }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ width: 28, height: 28, borderRadius: "50%", background: openStep === s.step ? "#00E676" : "#1A1A1A", color: openStep === s.step ? "#000" : "#555", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{s.step}</span>
                    <div style={{ flex: 1 }}>
                      <span style={{ fontSize: 13, fontWeight: 700 }}>{s.name}</span>
                      <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>{s.desc}</span>
                    </div>
                  </div>
                  {openStep === s.step && (<div id={`consensus-panel-${s.step}`} role="region" style={{ marginTop: 12, marginLeft: 40, fontSize: 11, color: "#999", lineHeight: 1.7 }}>{s.detail}</div>)}
                </div>
              ))}
            </div>
            <div style={{ marginTop: 24, background: "#0D0808", border: "1px solid #331A1A", borderRadius: 8, padding: 16 }}>
              <div style={{ fontSize: 9, letterSpacing: 2, color: "#FF6B35", marginBottom: 10 }}>EXAMPLE: REAL CONFLICT RESOLUTION</div>
              <div style={{ fontSize: 11, color: "#AAA", lineHeight: 1.8 }}>
                <div style={{ marginBottom: 8 }}><span style={{ color: "#FF6B35" }}>\uD83D\uDD25 Metabolic:</span> "Recommend 18:8 intermittent fasting \u2014 glucose variability is high."</div>
                <div style={{ marginBottom: 8 }}><span style={{ color: "#5C6BC0" }}>\uD83C\uDF19 Recovery:</span> "Challenge \u2014 cortisol is already elevated. Extended fasting will worsen sleep."</div>
                <div style={{ marginBottom: 8 }}><span style={{ color: "#2E7D32" }}>\uD83E\uDD6C Nutrition:</span> "Supporting Recovery \u2014 ferritin is borderline. Reduced eating window risks iron intake."</div>
                <div style={{ marginBottom: 8 }}><span style={{ color: "#FF6B35" }}>\uD83D\uDD25 Metabolic:</span> "Compromise: 14:10 window instead of 18:6."</div>
                <div style={{ marginBottom: 8 }}><span style={{ color: "#37474F" }}>\uD83E\uDDE0 Orchestrator:</span> "Approved: 14:10. Recovery concern has priority (safety-first). Iron monitoring flagged for next panel."</div>
                <div style={{ color: "#666", fontStyle: "italic" }}>\u2192 Twin updated: new protocol event, consensus log recorded.</div>
              </div>
            </div>
          </div>
        )}

        {activeSection === "twin" && (
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: "0 0 8px 0" }}>Digital Twin Schema</h2>
            <p style={{ color: "#777", fontSize: 12, lineHeight: 1.7, marginBottom: 24 }}>4 layers, from static identity to dynamic agent memory. The Twin is mostly append-only. \u201CCurrent state\u201D is always computed from the event stream.</p>
            {twinSchema.map((layer) => (
              <div key={layer.layer} style={{ marginBottom: 16, background: "#0C0C0C", border: "1px solid #1A1A1A", borderRadius: 8, overflow: "hidden" }}>
                <div style={{ background: layer.color + "22", borderBottom: `1px solid ${layer.color}33`, padding: "10px 16px", display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: layer.color }} />
                  <span style={{ fontSize: 12, fontWeight: 700, color: layer.color }}>{layer.layer}</span>
                </div>
                <div style={{ padding: "8px 0" }}>
                  {layer.fields.map((f, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "flex-start", padding: "6px 16px", borderBottom: i < layer.fields.length - 1 ? "1px solid #111" : "none", gap: 12, flexWrap: "wrap" }}>
                      <code style={{ fontSize: 11, color: "#CCC", minWidth: 180, flexShrink: 0 }}>{f.name}</code>
                      <span style={{ fontSize: 9, padding: "2px 8px", borderRadius: 4, background: typeColor(f.type)[0], color: typeColor(f.type)[1], flexShrink: 0, letterSpacing: 1 }}>{f.type.toUpperCase()}</span>
                      <span style={{ fontSize: 10, color: "#666" }}>{f.desc}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            <div style={{ background: "#0A0A0A", border: "1px solid #1A1A1A", borderRadius: 8, padding: 16, marginTop: 8 }}>
              <div style={{ fontSize: 9, letterSpacing: 2, color: "#00E676", marginBottom: 8 }}>WHY THIS STRUCTURE</div>
              <p style={{ fontSize: 11, color: "#888", lineHeight: 1.7, margin: 0 }}>CQRS + Event Sourcing adapted for health data. Writes go to the event stream (append-only, immutable). Reads come from materialized computed state. Agent memory is also append-only. This means: full audit trail, time-travel debugging, and ability to re-run any agent against historical state. Adding a new biomarker type is just a schema registry entry, not a database migration.</p>
            </div>
          </div>
        )}

        {activeSection === "ux" && (
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: "0 0 8px 0" }}>User Experience Flows</h2>
            <p style={{ color: "#777", fontSize: 12, lineHeight: 1.7, marginBottom: 24 }}>5 core interaction patterns. The user never sees \u201Cagents\u201D as technical infrastructure \u2014 they experience personalized health specialists they can talk to.</p>
            {uxFlows.map((flow, fi) => (
              <div
                key={fi}
                className="interactive-control"
                role="button"
                tabIndex={0}
                onClick={() => setOpenFlow(openFlow === fi ? null : fi)}
                onKeyDown={(e) => {
                  if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    setOpenFlow(openFlow === fi ? null : fi);
                  }
                }}
                aria-expanded={openFlow === fi}
                aria-controls={`flow-panel-${fi}`}
                style={{ background: openFlow === fi ? "#111" : "#0C0C0C", border: `1px solid ${openFlow === fi ? "#00BFA533" : "#161616"}`, borderRadius: 8, padding: openFlow === fi ? 20 : 14, marginBottom: 8 }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 10, color: "#00BFA5", fontWeight: 700, minWidth: 70, textAlign: "right" }}>{flow.time}</span>
                  <span style={{ fontSize: 13, fontWeight: 700, flex: 1 }}>{flow.name}</span>
                  <span style={{ color: "#333", fontSize: 14, transform: openFlow === fi ? "rotate(45deg)" : "none", transition: "transform 0.15s" }}>+</span>
                </div>
                {openFlow === fi && (
                  <div id={`flow-panel-${fi}`} role="region" style={{ marginTop: 14 }}>
                    <p style={{ fontSize: 11, color: "#999", lineHeight: 1.7, margin: "0 0 14px 0" }}>{flow.desc}</p>
                    <div style={{ fontSize: 9, letterSpacing: 2, color: "#555", marginBottom: 8 }}>SCREENS</div>
                    {flow.screens.map((screen, si) => (
                      <div key={si} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "6px 0", borderBottom: si < flow.screens.length - 1 ? "1px solid #151515" : "none" }}>
                        <span style={{ width: 20, height: 20, borderRadius: 4, background: "#1A1A1A", color: "#555", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, flexShrink: 0 }}>{si + 1}</span>
                        <span style={{ fontSize: 11, color: "#AAA", lineHeight: 1.6 }}>{screen}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
            <div style={{ marginTop: 20, background: "#0A0D0A", border: "1px solid #1A2A1A", borderRadius: 8, padding: 16 }}>
              <div style={{ fontSize: 9, letterSpacing: 2, color: "#00E676", marginBottom: 8 }}>UX PHILOSOPHY</div>
              <p style={{ fontSize: 11, color: "#888", lineHeight: 1.7, margin: 0 }}>The product surface is deliberately narrow. Most days, the user sees exactly one screen: the Morning Briefing with 3 priorities. This is a recommendation product, not a dashboard product. The agents are the depth; the daily plan is the surface.</p>
            </div>
          </div>
        )}

        {activeSection === "daily" && (
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: "0 0 8px 0" }}>Daily Recommendation Engine</h2>
            <p style={{ color: "#777", fontSize: 12, lineHeight: 1.7, marginBottom: 24 }}>The most critical product loop. Runs overnight, delivers at wake time.</p>
            {[
              { time: "02:00", label: "INGEST", color: "#455A64", desc: "Overnight wearable data sync completes. Last 24h of events are finalized in the Twin." },
              { time: "02:15", label: "OBSERVE", color: "#1565C0", desc: "All 5 domain agents independently read the Twin. Each computes their domain score." },
              { time: "02:30", label: "PROPOSE", color: "#2E7D32", desc: "Each agent submits up to 3 proposals to the message bus with priority and evidence." },
              { time: "02:45", label: "CONSENSUS", color: "#FF6B35", desc: "Orchestrator runs the 6-step consensus protocol. Conflicts are resolved." },
              { time: "03:00", label: "SYNTHESIZE", color: "#6A1B9A", desc: "Top 3 actions selected. Considers: user goals, yesterday\u2019s adherence, current protocol phase." },
              { time: "03:15", label: "GENERATE", color: "#00838F", desc: "Morning briefing generated: pulse summary, 3 actions with plain-language rationale." },
              { time: "03:30", label: "COMMIT", color: "#37474F", desc: "Twin updated with new snapshot, consensus log, recommendation events." },
              { time: "~7:00", label: "DELIVER", color: "#00E676", desc: "Push notification \u2192 user opens app \u2192 Morning Briefing. Interactions logged as events." },
            ].map((step, i) => (
              <div key={i} className="pipeline-row" style={{ display: "flex", gap: 14, marginBottom: 4 }}>
                <div className="pipeline-time" style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 50, flexShrink: 0 }}>
                  <span style={{ fontSize: 10, color: "#555", fontWeight: 600 }}>{step.time}</span>
                  {i < 7 && <div className="pipeline-line" style={{ width: 1, flex: 1, background: "#1A1A1A", marginTop: 4 }} />}
                </div>
                <div style={{ flex: 1, background: "#0C0C0C", border: "1px solid #161616", borderRadius: 6, padding: "10px 14px", marginBottom: 4 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <div style={{ width: 8, height: 8, borderRadius: 2, background: step.color }} />
                    <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: step.color }}>{step.label}</span>
                  </div>
                  <div style={{ fontSize: 11, color: "#888", lineHeight: 1.6 }}>{step.desc}</div>
                </div>
              </div>
            ))}
            <div style={{ marginTop: 24, background: "#0A0D0A", border: "1px solid #00E67622", borderRadius: 10, padding: 20 }}>
              <div style={{ fontSize: 9, letterSpacing: 2, color: "#00E676", marginBottom: 14 }}>EXAMPLE: MORNING BRIEFING OUTPUT</div>
              <div style={{ background: "#050505", borderRadius: 8, padding: 16, border: "1px solid #1A1A1A" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>Good morning \u2600\uFE0F</div>
                    <div style={{ fontSize: 10, color: "#666", marginTop: 2 }}>Monday, Feb 23 \u00B7 Recovery: 82% \u00B7 Sleep: 7.4h</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 20, fontWeight: 700, color: "#00E676" }}>78</div>
                    <div style={{ fontSize: 9, color: "#555" }}>TWIN SCORE</div>
                  </div>
                </div>
                {[
                  { icon: "\uD83D\uDCAA", label: "30min Zone 2 after lunch", agent: "Fitness", why: "VO2max trending flat \u2014 needs aerobic stimulus. Recovery is green-lit." },
                  { icon: "\uD83E\uDD6C", label: "Add pumpkin seeds to dinner", agent: "Nutrition", why: "Ferritin dropped 12% last panel. Dietary iron > supplement given gut markers." },
                  { icon: "\uD83C\uDF19", label: "Blue light cutoff by 9:30pm", agent: "Recovery", why: "Sleep onset latency averaged 34min this week. Screen timing is the easiest lever." },
                ].map((rec, i) => (
                  <div key={i} style={{ padding: "10px 0", borderTop: i > 0 ? "1px solid #151515" : "none" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 18 }}>{rec.icon}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 12, fontWeight: 600 }}>{rec.label}</div>
                        <div style={{ fontSize: 10, color: "#666", marginTop: 2 }}>via <span style={{ color: "#888" }}>{rec.agent}</span> \u00B7 {rec.why}</div>
                      </div>
                      <div style={{ width: 20, height: 20, borderRadius: 4, border: "1px solid #333", flexShrink: 0 }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </main>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
